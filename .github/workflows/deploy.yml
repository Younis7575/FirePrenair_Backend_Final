name: Deploy backend to EC2

# Push to main deploys. `workflow_dispatch` lets you re-run a deploy by hand
# from the Actions tab without pushing an empty commit.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # Editing the read-only diagnose workflow is not a release.
      - '.github/workflows/diagnose.yml'
      - '.github/workflows/reconcile-migrations.yml'
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the box at once.
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deploy script runs on the live box with `set -Eeuo pipefail`. Bash
      # parses as it goes, so a syntax error half way down would not surface
      # until the script was already part way through a deploy. Check it here,
      # where the `deploy` job cannot start unless this one passes.
      - name: Check the deploy script parses
        run: |
          for f in deploy/*.sh; do
            bash -n "$f" || { echo "::error::$f has a syntax error"; exit 1; }
            echo "$f parses."
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prenair/requirements.txt

      - name: Install dependencies
        working-directory: prenair
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The module named here is the one the server actually starts with, taken
      # from the same repository variable the deploy step exports. Checking
      # production_settings.py while the box runs settings.py -- which is what
      # this job used to do -- means a mistake in the file that matters sails
      # through CI and is only found by the deploy.
      - name: Django system check (the settings the server runs)
        working-directory: prenair
        env:
          DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE || 'prenair.settings' }}
          # These only need to be *present*, not valid. The real values live in
          # the server's .env and never leave it.
          #
          # They are required because several modules build their API clients at
          # import time -- home/views.py does `client = OpenAI()` at module
          # level, so importing the URLconf raises OpenAIError when the key is
          # absent. Worth fixing properly one day (build the clients lazily, in
          # the view that uses them): as it stands, a missing key does not
          # degrade one AI feature, it stops the whole site from starting.
          DJANGO_SECRET_KEY: ci-placeholder-not-a-real-secret
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          GROQ_API_KEY: ci-placeholder-not-a-real-key
        run: python manage.py check

      # A model change without its migration is the failure this pipeline is
      # least able to survive: the code reaches the server, the column does not,
      # and the page 500s. Catch it here, where nothing is at stake yet.
      - name: Fail if a model change has no migration
        working-directory: prenair
        env:
          DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE || 'prenair.settings' }}
          DJANGO_SECRET_KEY: ci-placeholder-not-a-real-secret
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          GROQ_API_KEY: ci-placeholder-not-a-real-key
        run: |
          if ! python manage.py makemigrations --check --dry-run; then
            echo "::error::A model changed but no migration was committed. Run 'python manage.py makemigrations', commit the file, and push again."
            exit 1
          fi
          echo "Every model change has a migration."

      - name: Report DEBUG
        run: |
          for f in prenair/prenair/settings.py prenair/prenair/production_settings.py; do
            if grep -qE '^\s*DEBUG\s*=\s*True' "$f"; then
              echo "::warning::DEBUG=True in $(basename "$f")"
            else
              echo "DEBUG is off in $(basename "$f")."
            fi
          done
          # Only the module the server actually starts with is a hard failure.
          RUNNING="${{ vars.DJANGO_SETTINGS_MODULE || 'prenair.settings' }}"
          RUNNING_FILE="prenair/${RUNNING//.//}.py"
          if grep -qE '^\s*DEBUG\s*=\s*True' "$RUNNING_FILE"; then
            echo "::warning::The server runs $RUNNING with DEBUG=True. Django's error pages expose settings, file paths and SQL to visitors. This should be turned off, but flipping it changes what users see, so it is a warning here rather than a blocked deploy."
          fi

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    # Attach this job to a GitHub Environment so you can require an approval
    # before anything touches the live box (Settings → Environments).
    environment: production
    steps:
      # Until the secrets and variables are filled in, a push would otherwise
      # end in a red failed run. Report what is missing and stop cleanly
      # instead — an unconfigured pipeline is not a broken build.
      - name: Preflight — is the pipeline configured?
        id: preflight
        run: |
          missing=()
          [ -n "${{ secrets.EC2_HOST }}"    ] || missing+=("secret EC2_HOST")
          [ -n "${{ secrets.EC2_USER }}"    ] || missing+=("secret EC2_USER")
          [ -n "${{ secrets.EC2_SSH_KEY }}" ] || missing+=("secret EC2_SSH_KEY")
          [ -n "${{ vars.APP_DIR }}"        ] || missing+=("variable APP_DIR")
          [ -n "${{ vars.DJANGO_DIR }}"     ] || missing+=("variable DJANGO_DIR")
          [ -n "${{ vars.VENV_DIR }}"       ] || missing+=("variable VENV_DIR")
          [ -n "${{ vars.SERVICE_NAME }}"   ] || missing+=("variable SERVICE_NAME")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped — pipeline not configured yet"
              echo
              echo "Still to set in **Settings → Secrets and variables → Actions**:"
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo
              echo "Run \`deploy/inspect.sh\` on the server to get the variable values."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Deploy skipped — ${#missing[@]} setting(s) still missing. See the job summary."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.preflight.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          # The script lives in the repo, so the deploy logic is reviewed like
          # any other code instead of living in this YAML.
          script: |
            set -e
            export APP_DIR="${{ vars.APP_DIR }}"
            export DJANGO_DIR="${{ vars.DJANGO_DIR }}"
            export VENV_DIR="${{ vars.VENV_DIR }}"
            export SERVICE_NAME="${{ vars.SERVICE_NAME }}"
            export DJANGO_SETTINGS_MODULE="${{ vars.DJANGO_SETTINGS_MODULE }}"
            export HEALTH_URL="${{ vars.HEALTH_URL }}"
            export DEPLOY_BRANCH=main
            cd "$APP_DIR"
            git fetch --prune origin
            # Refresh the script itself first, then hand over to it.
            git checkout "origin/main" -- deploy/deploy.sh
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh
