name: Diagnose server

# Read-only look at the live box. Run it from the Actions tab when something
# is wrong and you need facts rather than guesses. It changes nothing.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-production
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Look at the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            DJANGO_DIR="${{ vars.DJANGO_DIR }}"
            cd "$DJANGO_DIR"
            export $(grep -E '^DB_' .env | tr -d ' "' | xargs)

            echo "===== what django_migrations records for the project's apps ====="
            PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -At -F'  ' -c \
              "SELECT app, name, applied FROM django_migrations
               WHERE app IN ('profiles','commu_prenair','work_prenair','digi_prenair',
                             'edu_prenair','dashboard','home')
               ORDER BY app, id"

            echo
            echo "===== totals per app ====="
            PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -At -F'  ' -c \
              "SELECT app, count(*) FROM django_migrations GROUP BY app ORDER BY app"

            echo
            echo "===== migration files now on the server ====="
            find . -path '*/migrations/*.py' ! -name '__init__.py' | sort
