name: Diagnose server

# Read-only look at the live box. Run it from the Actions tab when something
# is wrong and you need facts rather than guesses. It changes nothing.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-production
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Look at the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            DJANGO_DIR="${{ vars.DJANGO_DIR }}"
            cd "$DJANGO_DIR"

            echo "===== A. migration files ON THE SERVER (per app) ====="
            for d in */migrations; do
              [ -d "$d" ] || continue
              n=$(ls "$d"/*.py 2>/dev/null | grep -v __init__ | wc -l)
              echo "$n  $d"
            done

            echo
            echo "===== B. every server migration filename (sha1 so we can compare) ====="
            find . -path '*/migrations/*.py' ! -name '__init__.py' -printf '%p\n' \
              | sort | while read -r f; do printf '%s  %s\n' "$(sha1sum "$f" | cut -c1-8)" "$f"; done

            echo
            echo "===== C. what the database says is applied ====="
            ../venv/bin/python manage.py showmigrations --plan 2>&1 | tail -40

            echo
            echo "===== D. count applied vs unapplied ====="
            ../venv/bin/python manage.py showmigrations --plan 2>/dev/null | grep -c '^\[X\]' | sed 's/^/applied  : /'
            ../venv/bin/python manage.py showmigrations --plan 2>/dev/null | grep -c '^\[ \]' | sed 's/^/pending  : /'

            echo
            echo "===== E. which ones are pending ====="
            ../venv/bin/python manage.py showmigrations --plan 2>/dev/null | grep '^\[ \]'
