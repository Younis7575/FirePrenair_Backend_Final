# Serve uploaded media from nginx instead of Django.
#
# Three reasons:
#   1. Django only serves media because DEBUG=True. The day DEBUG is turned off
#      -- which it should be -- every uploaded image would 404. This makes media
#      independent of that setting.
#   2. 152 of the 265 files the database references are not on this server. They
#      were uploaded to an earlier machine and no copy survives, so they cannot
#      be restored. Images fall back to a placeholder rather than a broken icon.
#   3. Cloudflare challenges every visitor outside the UAE (custom rule
#      "Duplicate of Block_Country_Traffic_Netherlands"). A browser solves that
#      challenge; the mobile app's HTTP client cannot, so every image it asked
#      for came back 403. An existing rule already exempts anything whose URI
#      contains "/api", so media is served under /api/images/ as well and
#      MEDIA_URL points there. The plain /images/ paths stay for links already
#      in the wild.
#
# Paste this inside the `server { ... }` block for fireprenair.com.
# It must come BEFORE `location / { ... }`.
#
# Ordering note: nginx tries prefix locations first but a matching regex wins,
# and regexes are tried in the order written. So each pair below puts the image
# regex first (it gets the placeholder fallback) and the catch-all prefix after.

# ---- /api/images/ : what MEDIA_URL points at, and what the app requests ------

location ~* ^/api/images/(?<media_file>.+\.(?:png|jpe?g|gif|webp|bmp|svg))$ {
    alias /home/ubuntu/Fireprenair/prenair/static/images/$media_file;
    access_log off;
    expires 7d;
    error_page 404 = @image_placeholder;
}

location /api/images/ {
    alias /home/ubuntu/Fireprenair/prenair/static/images/;
    access_log off;
    expires 7d;
}

# ---- /images/ : the original paths, still linked from older records ----------

location ~* ^/images/.*\.(png|jpe?g|gif|webp|bmp|svg)$ {
    root /home/ubuntu/Fireprenair/prenair/static;
    access_log off;
    expires 7d;
    error_page 404 = @image_placeholder;
}

# Everything else under /images/ (videos, downloadable products). A missing
# download is not something a placeholder can stand in for, so it stays a 404.
location /images/ {
    root /home/ubuntu/Fireprenair/prenair/static;
    access_log off;
    expires 7d;
}

location @image_placeholder {
    root /home/ubuntu/Fireprenair/prenair/static;
    try_files /images/misc/placeholder.svg =404;
}
