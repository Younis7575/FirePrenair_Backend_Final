# Chat WebSocket under /api/ws/ for the mobile app.
#
# Cloudflare challenges /ws/... for visitors outside the allowed countries (the
# same rule that blocked app image requests), and a WebSocket handshake cannot
# solve a challenge, so the app got "HTTP 403" and chat stayed offline. An
# existing Cloudflare rule already lets any URI containing "/api" through, so
# the app connects to /api/ws/... and nginx hands it to the unchanged /ws/...
# handling (the same upstream and Upgrade headers the website's chat uses).
#
# Paste/sync inside the `server { ... }` block for fireprenair.com, before
# `location / { ... }` (deploy.sh does this automatically).

location /api/ws/ {
    rewrite ^/api/ws/(.*)$ /ws/$1 last;
}
