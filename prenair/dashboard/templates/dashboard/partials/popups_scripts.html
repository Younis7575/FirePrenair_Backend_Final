{% include 'work_prenair/create_gig.html' %}
{% include 'dashboard/upload_item_digiprenair.html' %}
{% include 'dashboard/course_create_eduprenair.html' %}


<script>
    document.addEventListener('DOMContentLoaded', function () {
      const openBtns = document.querySelectorAll('.open-gig-popup');

      openBtns.forEach(openBtn => {
        openBtn.addEventListener('click', async function (e) {
          e.preventDefault();
          e.stopPropagation();

          const url = this.getAttribute('data-url');

          try {
            const response = await fetch(url, {
              headers: {
                'X-Requested-With': 'XMLHttpRequest'
              }
            });

            if (!response.ok) {
              throw new Error('Network response was not ok');
            }

            const html = await response.text();

            // Create a temporary container to parse the HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;

            // Find the gig popup in the response
            const gigPopup = tempDiv.querySelector('.gig-creation-popup');

            if (gigPopup) {
              // Remove any existing popup first
              const existingPopup = document.querySelector('.gig-creation-popup');
              if (existingPopup) {
                existingPopup.remove();
              }

              // Add the new popup to the body and show it
              document.body.appendChild(gigPopup);
              gigPopup.classList.remove('hidden');

              // Initialize the form functionality
              if (typeof initializeGigCreationForm === 'function') {
                initializeGigCreationForm();
              }
            }

          } catch (error) {
            console.error('Error loading gig creation form:', error);
            alert('Error loading gig creation form. Please try again.');
          }
        });
      });
    });

  </script>
