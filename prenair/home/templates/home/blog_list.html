{% extends "home/partials/base.html" %}
{% load static %}

{% block title %}Blogs{% endblock %}

{% block content %}

<style>

</style>

<div class="page-content" style="background: url({% static 'home/images/banner.png' %});">
			<div class="container">
				<div class="row">
					<div class="col-lg-12 col-md-12">
						<div class="row">
                            {% for blog in posts %}
							<div class="col-md-3 col-sm-12">

								<!-- Blog Post -->
								<div class="blog grid-blog">
									<div class="blog-image" style="border: 2px solid black;">
										<a href="{% url 'blog_detail' blog.slug %}"><img class="img-fluid"
												src="{{blog.featured_image.url}}" alt="Post Image"></a>
									</div>
									<div class="blog-grid-box" style="margin: 0;">
										<div class="blog-info clearfix">
											<div class="post-left">
												<ul>
													<li><img class="img-fluid" src="{% static 'home/images/icon-22.svg' %}"
															alt="Img">{{blog.published_date.date}}</li>
													<li><img class="img-fluid" src="{% static 'home/images/icon-23.svg' %}"
															alt="Img">{{blog.category.name}}</li>
												</ul>
											</div>
										</div>
										<h3 class="blog-title"><a href="{% url 'blog_detail' blog.slug %}">{{blog.title}}</a></h3>
										<div class="blog-content blog-read">
											<p>{{blog.content|slice:"100"}}...</p>
											<a href="{% url 'blog_detail' blog.slug %}" class="category-btn-final" style="color: white; width: fit-content;">Read More</a>
										</div>
									</div>
								</div>
								<!-- /Blog Post -->

							</div>
                            {% endfor %}
