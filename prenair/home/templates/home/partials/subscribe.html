<style>
    .custom-overlap-box {
    position: relative;
    margin-bottom: -140px;
    background-color: white;
    padding: 40px;
    border-radius: 0px 15px 15px 15px;
    max-width: 1306px;
    margin-left: auto;
    margin-right: auto;
    z-index: 2;
    box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
    text-align: center; /* Center content */
}

.custom-overlap-box h2 {
    font-size: 28px;
    color: #333;
    margin-bottom: 10px;
}

.custom-overlap-box p {
    color: #555;
    font-size: 16px;
    margin-bottom: 20px;
}

/* Subscribe Form Styling */
.custom-subscribe-form {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px; /* Space between input and button */
    max-width: 600px;
    margin: 0 auto;
    flex-wrap: wrap; /* Ensure proper layout on smaller screens */
}

.custom-subscribe-input {
    padding: 12px 15px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: calc(100% - 120px);
    max-width: 400px; /* Adjust max-width for input */
    box-sizing: border-box;
}

.custom-subscribe-button {
    padding: 12px 25px;
    font-size: 16px;
    color: white;
    background-color: #FF6F61; /* Red color matching the background */
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}

.custom-subscribe-button:hover {
    background-color: #e65a50; /* Slightly darker on hover */
}
</style>


<div class="custom-overlap-box" style="margin-bottom: 2rem;">
    <h2>Subscribe to Our Newsletter</h2>
    <p>
      Stay updated with the latest news, tips, and exclusive offers. Sign up
      for our newsletter today!
    </p>
    <form class="custom-subscribe-form">
      <input
        type="email"
        class="custom-subscribe-input"
        placeholder="Enter your email"
        required
      />
      <button type="submit" class="category-btn-final" style="padding: 15px;">
        Subscribe
      </button>
    </form>
  </div>
